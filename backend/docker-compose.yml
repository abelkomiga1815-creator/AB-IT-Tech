# Local PostgreSQL for development only. Credentials come from your .env file (see .env.example);
# nothing secret is stored in this file.
#   docker compose up -d      start the database
#   docker compose down       stop it (data is kept in the named volume)
services:
  postgres:
    image: postgres:16
    container_name: abittech-postgres
    environment:
      POSTGRES_DB: abittech
      POSTGRES_USER: ${DATABASE_USERNAME:?set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - abittech-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d abittech"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  abittech-pgdata:
