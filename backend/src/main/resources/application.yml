# Default configuration shared by every profile.
# Secrets are NEVER written here: they come from environment variables
# (or from a local, git-ignored .env file in the backend/ directory).

spring:
  application:
    name: abittech-platform
  profiles:
    default: dev            # use SPRING_PROFILES_ACTIVE=prod in production
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate    # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true    # never allow Flyway to wipe the database
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  jwt:
    secret: ${JWT_SECRET}                      # required, at least 32 characters
    expiration-ms: ${JWT_EXPIRATION:86400000}  # default 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}  # comma-separated; empty = no cross-origin access
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY}              # required, same value as in the AI service, min. 32 characters
    connect-timeout-ms: 3000
    read-timeout-ms: 90000                      # an analysis queries three external sources
    min-seconds-between-analyses: 60
  rate-limit:
    enabled: true
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    inquiry-per-minute: ${RATE_LIMIT_INQUIRY_PER_MINUTE:5}
  storage:
    documents-dir: ${DOCUMENTS_DIR:./data/documents}   # uploaded project documents
    max-file-size-bytes: 10485760                      # 10 MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Set FORWARD_HEADERS_STRATEGY=framework ONLY behind a trusted reverse proxy that overwrites X-Forwarded-For;
  # otherwise clients could fake their address and bypass the rate limits.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: AB IT TECH SOLUTIONS - Main Backend
    group: GROUP 3

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
