# AB IT TECH SOLUTIONS: the whole system on one machine.
#   cp .env.example .env     (then edit the values)
#   docker compose up -d --build
# Ports are published on 127.0.0.1 only. For a public deployment put an HTTPS reverse proxy in front
# (see docs/DEPLOYMENT.md and deploy/docker-compose.proxy.yml).
name: abittech

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: abittech
      POSTGRES_USER: ${DATABASE_USERNAME:?set DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d abittech"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?set AI_SERVICE_API_KEY in .env}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    # no published port: only the backend talks to it, over the internal network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/abittech
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DOCUMENTS_DIR: /data/documents
    volumes:
      - documents:/data/documents
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  corporate-website:
    build:
      context: ./corporate-website
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEBSITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_STUDENT_PLATFORM_URL: ${PUBLIC_STUDENT_URL:-http://localhost:3001}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        NEXT_PUBLIC_CONTACT_PHONE: ${CONTACT_PHONE:-}
        NEXT_PUBLIC_CONTACT_ADDRESS: ${CONTACT_ADDRESS:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  student-platform:
    build:
      context: ./student-platform
      args:
        NEXT_PUBLIC_CORPORATE_SITE_URL: ${PUBLIC_WEBSITE_URL:-http://localhost:3000}
    environment:
      BACKEND_URL: http://backend:8080     # server side only: browsers never see it
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped

volumes:
  pgdata:       # the database
  documents:    # uploaded student documents: back this up together with the database
